# Netlify builds the Astro site from this folder and serves the static output.
# Node version comes from .nvmrc (22).
[build]
  command = "npm run build"
  publish = "dist"

# Long cache for fingerprinted assets and fonts; pages stay fresh.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
